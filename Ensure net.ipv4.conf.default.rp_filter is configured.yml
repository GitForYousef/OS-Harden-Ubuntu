---
- name: CIS 3.3.1.13 - Configure net.ipv4.conf.default.rp_filter
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Create sysctl configuration directory
      ansible.builtin.file:
        path: /etc/sysctl.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Find custom sysctl configuration files
      ansible.builtin.find:
        paths:
          - /etc/sysctl.d
        patterns:
          - "*.conf"
        file_type: file
      register: sysctl_files

    - name: Comment out conflicting default rp_filter settings
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(\s*)net\.ipv4\.conf\.default\.rp_filter\s*=\s*(?!1\b).*$'
        replace: '\1# CIS 3.3.1.13 - Disabled conflicting setting: \g<0>'
        backup: true
      loop: "{{ sysctl_files.files }}"
      when:
        - item.path != '/etc/sysctl.d/60-ipv4-rp_filter.conf'

    - name: Create compliant default rp_filter configuration
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-ipv4-rp_filter.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CIS 3.3.1.13
          # Ensure net.ipv4.conf.default.rp_filter is configured
          net.ipv4.conf.default.rp_filter = 1

    - name: Reload sysctl configuration
      ansible.builtin.command:
        cmd: sysctl --system
      register: sysctl_reload
      changed_when: true

    - name: Verify runtime default rp_filter value
      ansible.builtin.command:
        cmd: sysctl -n net.ipv4.conf.default.rp_filter
      register: rp_filter_value
      changed_when: false

    - name: Verify default rp_filter configuration
      ansible.builtin.shell:
        cmd: |
          grep -RPs '^\s*net\.ipv4\.conf\.default\.rp_filter\s*=\s*1\s*$' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null
      register: rp_filter_config
      changed_when: false
      failed_when: rp_filter_config.rc != 0

    - name: Assert CIS compliance
      ansible.builtin.assert:
        that:
          - rp_filter_value.stdout | trim == "1"
          - rp_filter_config.rc == 0
        success_msg: "CIS 3.3.1.13 compliant - net.ipv4.conf.default.rp_filter = 1"
        fail_msg: "net.ipv4.conf.default.rp_filter is not correctly configured"
