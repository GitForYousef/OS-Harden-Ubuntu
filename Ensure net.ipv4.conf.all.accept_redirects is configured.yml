---
- name: CIS 3.3.1.8 - Configure IPv4 accept_redirects
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Create sysctl configuration directory
      ansible.builtin.file:
        path: /etc/sysctl.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Find custom sysctl configuration files
      ansible.builtin.find:
        paths:
          - /etc/sysctl.d
        patterns:
          - "*.conf"
        file_type: file
      register: sysctl_files

    - name: Comment out conflicting accept_redirects settings
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(\s*)net\.ipv4\.conf\.all\.accept_redirects\s*=\s*(?!0\b).*$'
        replace: '\1# CIS 3.3.1.8 - Disabled conflicting setting: \g<0>'
        backup: true
      loop: "{{ sysctl_files.files }}"
      when:
        - item.path != '/etc/sysctl.d/60-ipv4_accept_redirects.conf'

    - name: Configure accept_redirects
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-ipv4_accept_redirects.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CIS 3.3.1.8
          # Ensure net.ipv4.conf.all.accept_redirects is configured
          net.ipv4.conf.all.accept_redirects = 0

    - name: Reload sysctl configuration
      ansible.builtin.command:
        cmd: sysctl --system
      register: sysctl_reload
      changed_when: true

    - name: Verify runtime accept_redirects value
      ansible.builtin.command:
        cmd: sysctl -n net.ipv4.conf.all.accept_redirects
      register: accept_redirects_value
      changed_when: false

    - name: Verify accept_redirects configuration
      ansible.builtin.shell:
        cmd: |
          grep -RPs '^\s*net\.ipv4\.conf\.all\.accept_redirects\s*=\s*0\s*$' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null
      register: accept_redirects_config
      changed_when: false
      failed_when: accept_redirects_config.rc != 0

    - name: Assert CIS compliance
      ansible.builtin.assert:
        that:
          - accept_redirects_value.stdout | trim == "0"
          - accept_redirects_config.rc == 0
        success_msg: "CIS 3.3.1.8 compliant - net.ipv4.conf.all.accept_redirects = 0"
        fail_msg: "net.ipv4.conf.all.accept_redirects is not correctly configured"
