---
- name: Remediate CIS 3.3.2.3 - IPv6 accept redirects
  hosts: all
  become: true

  tasks:

    - name: Ensure persistent IPv6 accept_redirects configuration
      ansible.builtin.lineinfile:
        path: /etc/sysctl.d/60-ipv6_sysctl.conf
        regexp: '^\s*net\.ipv6\.conf\.all\.accept_redirects\s*='
        line: 'net.ipv6.conf.all.accept_redirects = 0'
        create: true
        owner: root
        group: root
        mode: '0644'

    - name: Apply IPv6 accept_redirects immediately
      ansible.builtin.command:
        cmd: sysctl -w net.ipv6.conf.all.accept_redirects=0
      changed_when: false

    - name: Reload all sysctl configuration
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

    - name: Verify runtime IPv6 accept_redirects
      ansible.builtin.command:
        cmd: sysctl -n net.ipv6.conf.all.accept_redirects
      register: ipv6_accept_redirects
      changed_when: false

    - name: Verify persistent IPv6 accept_redirects
      ansible.builtin.command:
        cmd: >
          grep -E
          '^[[:space:]]*net\.ipv6\.conf\.all\.accept_redirects[[:space:]]*=[[:space:]]*0([[:space:]]|$)'
          /etc/sysctl.d/60-ipv6_sysctl.conf
      register: ipv6_accept_redirects_config
      changed_when: false

    - name: Assert IPv6 accept_redirects is disabled
      ansible.builtin.assert:
        that:
          - ipv6_accept_redirects.stdout | trim == "0"
          - ipv6_accept_redirects_config.rc == 0
        success_msg: "IPv6 accept_redirects is disabled and persistently configured."
        fail_msg: "IPv6 accept_redirects is not correctly configured."
