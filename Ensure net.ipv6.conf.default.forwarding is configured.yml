---
- name: Remediate CIS 3.3.2.2 - IPv6 default forwarding
  hosts: all
  become: true

  tasks:

    - name: Ensure persistent IPv6 default forwarding configuration exists
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-ipv6_sysctl.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CIS 3.3.2.1 - Disable IPv6 forwarding
          net.ipv6.conf.all.forwarding = 0

          # CIS 3.3.2.2 - Disable IPv6 default forwarding
          net.ipv6.conf.default.forwarding = 0
      notify: Reload sysctl

    - name: Ensure runtime IPv6 default forwarding is disabled
      ansible.builtin.command:
        cmd: sysctl -w net.ipv6.conf.default.forwarding=0
      changed_when: false

    - name: Verify runtime IPv6 default forwarding
      ansible.builtin.command:
        cmd: sysctl -n net.ipv6.conf.default.forwarding
      register: ipv6_default_forwarding
      changed_when: false

    - name: Verify persistent IPv6 default forwarding configuration
      ansible.builtin.command:
        cmd: >
          grep -E
          '^[[:space:]]*net\.ipv6\.conf\.default\.forwarding[[:space:]]*=[[:space:]]*0([[:space:]]|$)'
          /etc/sysctl.d/60-ipv6_sysctl.conf
      register: ipv6_default_config
      changed_when: false

    - name: Assert IPv6 default forwarding is disabled
      ansible.builtin.assert:
        that:
          - ipv6_default_forwarding.stdout | trim == "0"
          - ipv6_default_config.rc == 0
        success_msg: "IPv6 default forwarding is disabled and persistently configured."
        fail_msg: "IPv6 default forwarding is not correctly configured."

  handlers:

    - name: Reload sysctl
      ansible.builtin.command:
        cmd: sysctl --system
