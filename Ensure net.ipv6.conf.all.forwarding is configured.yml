---
- name: CIS 3.3.2.1 - Configure IPv6 forwarding
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Create sysctl configuration directory
      ansible.builtin.file:
        path: /etc/sysctl.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Find custom sysctl configuration files
      ansible.builtin.find:
        paths:
          - /etc/sysctl.d
        patterns:
          - "*.conf"
        file_type: file
      register: sysctl_files

    - name: Comment out conflicting IPv6 forwarding settings
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(\s*)net\.ipv6\.conf\.all\.forwarding\s*=\s*(?!0\b).*$'
        replace: '\1# CIS 3.3.2.1 - Disabled conflicting setting: \g<0>'
        backup: true
      loop: "{{ sysctl_files.files }}"
      when:
        - item.path != '/etc/sysctl.d/60-ipv6-forwarding.conf'

    - name: Configure IPv6 forwarding
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-ipv6-forwarding.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # CIS 3.3.2.1
          # Ensure net.ipv6.conf.all.forwarding is configured
          net.ipv6.conf.all.forwarding = 0

    - name: Reload sysctl configuration
      ansible.builtin.command:
        cmd: sysctl --system
      register: sysctl_reload
      changed_when: true

    - name: Verify runtime IPv6 forwarding value
      ansible.builtin.command:
        cmd: sysctl -n net.ipv6.conf.all.forwarding
      register: ipv6_forwarding
      changed_when: false

    - name: Verify persistent IPv6 forwarding configuration
      ansible.builtin.shell:
        cmd: |
          grep -RPs '^\s*net\.ipv6\.conf\.all\.forwarding\s*=\s*0\s*$' \
          /etc/sysctl.conf /etc/sysctl.d/*.conf 2>/dev/null
      register: ipv6_forwarding_config
      changed_when: false
      failed_when: ipv6_forwarding_config.rc != 0

    - name: Assert CIS compliance
      ansible.builtin.assert:
        that:
          - ipv6_forwarding.stdout | trim == "0"
          - ipv6_forwarding_config.rc == 0
        success_msg: "CIS 3.3.2.1 compliant - IPv6 forwarding = 0"
        fail_msg: "IPv6 forwarding is not correctly configured"
