---
- name: CIS 3.3.2.7 - Configure IPv6 accept_ra
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Ensure /etc/sysctl.d exists
      ansible.builtin.file:
        path: /etc/sysctl.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure IPv6 accept_ra
      ansible.builtin.lineinfile:
        path: /etc/sysctl.d/60-ipv6_sysctl.conf
        regexp: '^\s*net\.ipv6\.conf\.all\.accept_ra\s*='
        line: 'net.ipv6.conf.all.accept_ra = 0'
        create: true
        owner: root
        group: root
        mode: '0644'
      notify: Reload sysctl

    - name: Set runtime IPv6 accept_ra value
      ansible.builtin.sysctl:
        name: net.ipv6.conf.all.accept_ra
        value: '0'
        state: present
        reload: true

    - name: Verify IPv6 accept_ra
      ansible.builtin.command:
        cmd: sysctl net.ipv6.conf.all.accept_ra
      register: accept_ra_result
      changed_when: false

    - name: Display verification
      ansible.builtin.debug:
        msg: "{{ accept_ra_result.stdout }}"

  handlers:

    - name: Reload sysctl
      ansible.builtin.command:
        cmd: sysctl --system
