---
- name: CIS 3.3.2.8 - Configure IPv6 default accept_ra
  hosts: all
  become: true
  gather_facts: false

  tasks:

    - name: Ensure /etc/sysctl.d exists
      ansible.builtin.file:
        path: /etc/sysctl.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure IPv6 default accept_ra
      ansible.builtin.lineinfile:
        path: /etc/sysctl.d/60-ipv6_sysctl.conf
        regexp: '^\s*net\.ipv6\.conf\.default\.accept_ra\s*='
        line: 'net.ipv6.conf.default.accept_ra = 0'
        create: true
        owner: root
        group: root
        mode: '0644'

    - name: Apply sysctl configuration
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true

    - name: Verify runtime value
      ansible.builtin.command:
        cmd: sysctl net.ipv6.conf.default.accept_ra
      register: accept_ra_default
      changed_when: false

    - name: Display verification
      ansible.builtin.debug:
        msg: "{{ accept_ra_default.stdout }}"
